name: Build AU Daily Pack

on:
  workflow_dispatch:
  schedule:
    - cron: "5 22 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

        - name: Build daily packs
          run: python scripts/build_day_pack.py

      - name: Commit and push
        run: |
          git config user.name "eir-daily-pack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/au/daily.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update AU daily pack"
            git push
          fi

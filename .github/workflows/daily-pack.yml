name: Build Daily Packs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *" # runs daily (UTC)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        cc:
          # --- Core English ---
          - us
          - au
          - gb
          - ie
          - ca
          - nz

          # --- Europe ---
          - fr
          - de
          - es
          - it
          - pt
          - nl
          - be
          - ch
          - at
          - se
          - no
          - fi
          - dk
          - pl
          - cz
          - hu
          - ro
          - bg
          - gr
          - ua
          - ee
          - lv
          - lt

          # --- Americas ---
          - br
          - ar

          # --- Asia / Middle East ---
          - jp
          - sg
          - ae

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure public folder exists
        run: mkdir -p public/${{ matrix.cc }}

      - name: Build daily pack
        run: python scripts/build_daily_pack.py ${{ matrix.cc }}

      - name: Commit changes
        run: |
          git config user.name "eir-daily-pack-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public
          git commit -m "Update daily packs" || echo "No changes to commit"

      - name: Push changes
        run: git push

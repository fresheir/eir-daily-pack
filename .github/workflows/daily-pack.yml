name: Build Daily Packs

on:
  workflow_dispatch:
  schedule:
    - cron: "5 22 * * *"

permissions:
  contents: write

concurrency:
  group: daily-packs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc:
          # Core
          - au
          - us
          - gb
          - ie
          - ca
          - nz

          # Europe (example set — edit as needed)
          - fr
          - de
          - es
          - pt
          - it
          - nl
          - be
          - ch
          - at
          - se
          - no
          - dk
          - fi
          - pl
          - cz
          - sk
          - hu
          - ro
          - bg
          - gr
          - tr
          - ru
          - ua
          - rs
          - hr
          - si
          - ba
          - me
          - mk
          - al
          - lt
          - lv
          - ee
          - is
          - lu
          - mt
          - cy

          # South America
          - br
          - ar

          # Asia / Middle East
          - jp
          - cn
          - ae

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build pack for ${{ matrix.cc }}
        run: |
          python scripts/build_daily_pack.py ${{ matrix.cc }}

      # Upload only this country's JSON as an artifact
      - name: Upload artifact (${{ matrix.cc }})
        uses: actions/upload-artifact@v4
        with:
          name: pack-${{ matrix.cc }}
          path: public/${{ matrix.cc }}/daily.json
          if-no-files-found: error

  commit:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Download all country artifacts into public/<cc>/daily.json
      - name: Download all packs
        uses: actions/download-artifact@v4
        with:
          pattern: pack-*
          merge-multiple: true
          path: public

      - name: Commit and push once
        run: |
          git config user.name "eir-daily-pack-bot"
          git config user.email "actions@users.noreply.github.com"

          git add public/**/daily.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update daily packs"
          git push

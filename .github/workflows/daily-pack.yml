name: Build Daily Packs

on:
  workflow_dispatch:
  schedule:
    - cron: "5 22 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc:
          # Core
          - au
          - us
          - gb
          - ie
          - ca
          - nz

          # Europe (add/remove as you like)
          - fr
          - de
          - es
          - pt
          - it
          - nl
          - be
          - ch
          - at
          - se
          - no
          - dk
          - fi
          - pl
          - cz
          - sk
          - hu
          - ro
          - bg
          - gr
          - tr
          - ru
          - ua
          - rs
          - hr
          - si
          - ba
          - me
          - mk
          - al
          - lt
          - lv
          - ee
          - is
          - lu
          - mt
          - cy

          # South America
          - br
          - ar

          # Asia / Middle East
          - jp
          - cn
          - ae

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build daily packs
        run: |
          python scripts/build_day_pack.py ${{ matrix.cc }}

      - name: Commit and push
        run: |
          git config user.name "eir-daily-pack-bot"
          git config user.email "actions@users.noreply.github.com"

          # IMPORTANT: add all generated country JSONs
          git add public/**/daily.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update daily packs"
            git push
          fi

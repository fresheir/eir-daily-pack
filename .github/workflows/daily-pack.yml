name: Build Daily Packs

on:
  workflow_dispatch:
  schedule:
    - cron: "5 22 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build daily packs
        run: python scripts/build_daily_pack.py

      - name: Commit and push
        run: |
          git config user.name "eir-daily-pack-bot"
          git config user.email "actions@users.noreply.github.com"

          # Add ALL generated daily packs (supports multi-country folders)
          git add public/**/daily.json

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update daily packs"
          git push

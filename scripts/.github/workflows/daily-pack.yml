name: Build AU Daily Pack

on:
  schedule:
    - cron: "5 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_daily_pack.py
      - run: |
          git config user.name "eir-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/au/daily.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Daily AU news update"
            git push
          fi
